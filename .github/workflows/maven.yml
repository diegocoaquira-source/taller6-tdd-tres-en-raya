# Adaptación del workflow del docente: JDK 17, código compatible con Java 8.
name: Java CI con Maven
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar suite base
        run: mvn -B clean test "-Dtest=TresEnRayaBaseTest" --file pom.xml
      - name: Ejecutar suite ampliada
        run: mvn -B test "-Dtest=TresEnRayaIATest" --file pom.xml
      - name: Ejecutar ambas suites
        run: mvn -B test "-Dtest=TresEnRayaBaseTest,TresEnRayaIATest" --file pom.xml
      - name: Verificar proyecto completo y construir JAR
        run: mvn -B verify --file pom.xml
